<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>離線模式｜AI Class</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f7;font-family:"Noto Sans TC",system-ui,sans-serif;color:#1d1d1f;padding:24px}
.box{text-align:center;max-width:420px}
.icon{font-size:72px;margin-bottom:24px;filter:grayscale(.3)}
h1{font-size:24px;font-weight:800;margin-bottom:12px}
p{color:#6e6e73;line-height:1.6;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 32px;background:linear-gradient(135deg,#7c5cff,#ff5c8a);color:#fff;font-weight:700;font-size:15px;border:0;border-radius:14px;cursor:pointer;text-decoration:none}
.tip{margin-top:20px;font-size:13px;color:#aeaeb2}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>目前沒有網路連線</h1>
  <p>AI Class 需要網路才能載入課程內容。<br>請檢查你的網路連線後重新整理頁面。</p>
  <button class="btn" onclick="location.reload()">重新整理</button>
  <p class="tip">已購買的課程影片會在有網路時自動快取，方便你下次離線觀看。</p>
</div>
</body>
</html>

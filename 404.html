<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找不到頁面｜AI Class</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafafa;color:#1d1d1f;text-align:center;padding:40px 20px}
.code{font-size:8rem;font-weight:900;background:linear-gradient(135deg,#7c5cff,#ff5c8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
h1{font-size:1.5rem;margin:16px 0 8px}
p{color:#86868b;margin-bottom:24px;max-width:400px;line-height:1.6}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;padding:12px 28px;border-radius:12px;font-size:.95rem;font-weight:600;text-decoration:none;transition:all .25s}
.btn-pri{background:#7c5cff;color:#fff}
.btn-pri:hover{background:#6a4ae0;transform:translateY(-2px)}
.btn-ghost{border:1.5px solid #d2d2d7;color:#1d1d1f}
.btn-ghost:hover{border-color:#7c5cff;color:#7c5cff}
</style>
</head>
<body>
<div class="code">404</div>
<h1>哎呀，頁面走丟了</h1>
<p>你要找的頁面可能已移除、名稱已變更，或暫時無法使用。</p>
<div class="actions">
  <a href="index.html" class="btn btn-pri">回首頁</a>
  <a href="category.html" class="btn btn-ghost">瀏覽課程</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant-TW" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>找不到頁面｜OKAI課程網</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);text-align:center;padding:40px 20px;transition:background .3s,color .3s}
:root{--bg:#fafafa;--tx:#1d1d1f;--tx2:#5c5c63;--line:#d2d2d7}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b10;--tx:#e8e8ec;--tx2:#8e8e93;--line:#3a3a4a}}
.code{font-size:clamp(5rem,15vw,8rem);font-weight:900;background:linear-gradient(135deg,#7c5cff,#ff5c8a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
h1{font-size:clamp(1.2rem,3vw,1.5rem);margin:16px 0 8px}
p{color:var(--tx2);margin-bottom:24px;max-width:400px;line-height:1.6}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;padding:12px 28px;border-radius:14px;font-size:.95rem;font-weight:600;text-decoration:none;transition:all .25s}
.btn-pri{background:linear-gradient(135deg,#7c5cff,#a855f7);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.3)}
.btn-pri:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(124,92,255,.4)}
.btn-ghost{border:1.5px solid var(--line);color:var(--tx)}
.btn-ghost:hover{border-color:#5b3de0;color:#5b3de0}
.suggest{margin-top:40px;font-size:.85rem;color:var(--tx2)}
.suggest a{color:#5b3de0;text-decoration:none}
.suggest a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="code">404</div>
<h1>哎呀，頁面走丟了</h1>
<p>你要找的頁面可能已移除、名稱已變更，或暫時無法使用。</p>
<div class="actions">
  <a href="index.html" class="btn btn-pri">回首頁</a>
  <a href="category.html" class="btn btn-ghost">瀏覽課程</a>
</div>
<div class="suggest">
  或試試：<a href="search.html">搜尋課程</a>・<a href="blog.html">閱讀文章</a>・<a href="faq.html">常見問題</a>
</div>
</body>
</html>
